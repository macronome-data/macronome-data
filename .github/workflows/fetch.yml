name: fetch-calendar
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch feed
        run: |
          set -e
          curl -fsSL --retry 3 --retry-delay 5 -A "Mozilla/5.0" \
            https://nfs.faireconomy.media/ff_calendar_thisweek.json -o new.json
          python3 -c "import json;d=json.load(open('new.json'));assert isinstance(d,list) and len(d)>10"
          mv new.json calendar.json
      - name: Commit if changed
        run: |
          git config user.name "macronome-bot"
          git config user.email "bot@users.noreply.github.com"
          git add calendar.json
          git diff --cached --quiet || (git commit -m "update" && git push)
